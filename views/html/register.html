<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KROMA - Registro</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>

    <header>
        <div class="logo">
            <img src="https://via.placeholder.com/180x54/330000/ffffff?text=KROMA" alt="KROMA">
        </div>

        <div class="nav-right">
            <a href="#">ABOUT</a>
            <a href="#">ABOUT</a>
            <a href="#">ABOUT</a>
            <a href="#">ABOUT</a>
            <div class="profile">
                <img src="https://via.placeholder.com/54/330000/ffffff?text=Yo" alt="Perfil">
            </div>
        </div>
    </header>

    <div class="container">
        <div class="register-wrapper">
            
            <!-- FORMULARIO IZQUIERDA -->
            <div class="form-section">
                <h1>Únete a KROMA</h1>
                <p>Crea tu cuenta y comienza tu viaje de aprendizaje</p>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="form-group">
                        <label for="password-confirm">Confirmar contraseña</label>
                        <input type="password" id="password-confirm" name="password-confirm" placeholder="Repite tu contraseña" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Acepto los términos y condiciones</label>
                    </div>

                    <button type="submit" class="submit-btn">Crear cuenta</button>
                </form>

                <div class="login-link">
                    ¿Ya tienes cuenta? <a href="#">Inicia sesión</a>
                </div>
            </div>

            <!-- LOGO E INFO DERECHA -->
            <div class="info-section">
                <div class="logo-large">
                    <img src="https://via.placeholder.com/280/330000/ffffff?text=KROMA" alt="KROMA Logo">
                </div>
                <div class="info-text">
                    <h2>Aprende a tu ritmo</h2>
                    <p>KROMA es tu plataforma de aprendizaje interactivo. Domina nuevas habilidades con nuestro sistema gamificado de niveles y desafíos progresivos.</p>
                </div>
            </div>

        </div>
    </div>

    <div class="info">+info</div>

</body>

</html>
